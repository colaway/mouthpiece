[project]
name = "mouthpiece"
version = "0.0.1"
description = "Silent lip-reading dictation for macOS: mouth words, get typed text."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.12"
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.26",
    "opencv-python>=4.9",
    "torch>=2.4",
    "pyobjc-framework-AVFoundation>=10.0; sys_platform == 'darwin'",
    "mediapipe>=0.10.14",
    "pyside6-essentials>=6.7",
    "sentencepiece>=0.2.3",
    "pyobjc-framework-quartz>=10.0 ; sys_platform == 'darwin'",
    "pyobjc-framework-cocoa>=10.0 ; sys_platform == 'darwin'",
]

[project.scripts]
mouthpiece = "mouthpiece.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mouthpiece"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
mypy_path = "src"
